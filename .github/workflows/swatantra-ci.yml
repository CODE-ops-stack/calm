name: Swatantra v7.1 Android CI & Error Log Sync

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-and-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Run Unit Tests & Release Build Using Pre-Installed Android SDK
        run: |
          {
            echo "ANDROID_HOME=$ANDROID_HOME"
            yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null 2>&1 || true
            chmod +x ./gradlew
            ./gradlew test assembleRelease --no-daemon --stacktrace
          } > ci_build.log 2>&1

      - name: Prepare Email Summary Body
        if: always()
        run: |
          echo "=== SWATANTRA v7.1 MISSION CONTROL CI TELEMETRY ===" > ci_email_body.txt
          echo "Commit: ${{ github.sha }}" >> ci_email_body.txt
          echo "" >> ci_email_body.txt
          echo "=== TODO.md PROGRESS ===" >> ci_email_body.txt
          cat TODO.md >> ci_email_body.txt || true
          echo "" >> ci_email_body.txt
          echo "=== UBUNTU CI BUILD & TEST LOG (tail -n 100) ===" >> ci_email_body.txt
          tail -n 100 ci_build.log >> ci_email_body.txt || true

      - name: Send Build Telemetry Email to Gmail
        if: always()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.GMAIL_ADDRESS }}
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          subject: "[Swatantra CI] Build ${{ job.status }} — Commit ${{ github.sha }}"
          to: ${{ secrets.GMAIL_ADDRESS }}
          from: "Swatantra GitHub CI <${{ secrets.GMAIL_ADDRESS }}>"
          body: file://ci_email_body.txt
          attachments: TODO.md,error.log,ci_build.log,AUDIT_PROOF.txt
          ignore_missing: true
