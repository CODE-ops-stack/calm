name: Swatantra v7.1 Cloud Android 14 Human-Equivalent QA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
  schedule:
    - cron: '30 23 * * *'
    - cron: '30 6 * * *'
    - cron: '30 10 * * *'
    - cron: '30 14 * * *'

jobs:
  cloud-emulator-qa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Enable KVM for hardware-accelerated Android 14 emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Unit Tests, Assemble & Ephemerally Sign Release APK for Cloud QA
        run: |
          chmod +x ./gradlew scripts/run_human_equivalent_qa.sh
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          ./gradlew test assembleRelease --no-daemon
          BUILD_TOOLS_DIR=$(ls -d "$ANDROID_HOME/build-tools/"* | sort -V | tail -n 1)
          keytool -genkeypair -v -keystore /tmp/ci-ephemeral.jks -storepass ciqa1234 -keypass ciqa1234 -alias ciqa -keyalg RSA -keysize 2048 -validity 1 -dname "CN=SwatantraCI,O=Swatantra,C=IN"
          "$BUILD_TOOLS_DIR/zipalign" -v -p -f 4 app/build/outputs/apk/release/app-release-unsigned.apk /tmp/app-release-aligned.apk
          "$BUILD_TOOLS_DIR/apksigner" sign --ks /tmp/ci-ephemeral.jks --ks-pass pass:ciqa1234 --key-pass pass:ciqa1234 --ks-key-alias ciqa --v2-signing-enabled true --v3-signing-enabled true --out app/build/outputs/apk/release/app-release-ci-signed.apk /tmp/app-release-aligned.apk
          "$BUILD_TOOLS_DIR/apksigner" verify --verbose app/build/outputs/apk/release/app-release-ci-signed.apk

      - name: Run Human-Equivalent QA on Cloud Android 14 Emulator
        id: qa_run
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-boot-timeout: 300
          script: bash scripts/run_human_equivalent_qa.sh

      - name: Email [Swatantra QA] Cloud Emulator Report
        if: always()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.GMAIL_ADDRESS }}
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          subject: "[Swatantra QA] Cloud Android 14 QA ${{ steps.qa_run.outcome }} — Commit ${{ github.sha }}"
          to: ${{ secrets.GMAIL_ADDRESS }}
          from: "Swatantra Cloud QA <${{ secrets.GMAIL_ADDRESS }}>"
          body: file://qa_emulator_report.txt
          attachments: qa_emulator_report.txt,AUDIT_PROOF.txt,TODO.md

      - name: Fail job if QA reported any defect
        if: steps.qa_run.outcome != 'success'
        run: exit 1
